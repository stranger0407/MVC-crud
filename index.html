<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section  class="header">
            <h1>User Management</h1>
            <div class="function">
                <span id="sort_by">Sort By:</span>
                <select  id="sort_feild">
                    <option value="first_name">First Name</option>
                    <option value="last_name">Last Name</option>
                    <option value="age">Age</option>
                </select>
                <select  id="order">
                    <option value="asc">Ascending</option>
                    <option value="dsc">Descending</option>
                </select>
                <button id="sort_btn">Sort</button>
                <button id="add_new_user">Add New user</button>
            </div>
        </section>
        <section class="user">
            <header class="user_list_header ">
                <span class="user_list_first_name" >First Name</span>
                <span class="user_list_last_name" >Last name</span>
                <span class="user_list_email">Email</span>
                <span class="user_list_username">Username</span>
                <span class="user_list_age">Age</span>
                <span class="user_list_gender">Gender</span>
            </header>
            <main class="user_list">
    
            </main>
        </section>
    </div>
    <script src="contoller.js"></script>
</body>
</html>
